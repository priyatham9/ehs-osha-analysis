name: tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Run ruff
        run: ruff check .
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
  fixture-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Run synthetic fixture pipeline
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p "test_pipeline_on_fixture.py" -v
      - name: Verify summary.json was written
        run: |
          [ -f outputs/summary.json ] || exit 1
          python3 -c "import json; json.load(open('outputs/summary.json'))" || exit 1
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas coverage
      - name: Run tests under coverage
        run: PYTHONPATH=src coverage run -m unittest discover -s tests -v
      - name: Report coverage
        run: |
          coverage report -m
          coverage report -m | grep TOTAL | awk '{print "Coverage: " $NF}' >> $GITHUB_STEP_SUMMARY
